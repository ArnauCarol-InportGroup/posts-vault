name: Rellenar Buffer

on:
  # Once a week, Monday 06:00 UTC: tops the queue back up to the plan limit.
  schedule:
    - cron: "0 6 * * 1"
  # Whenever posts are added or edited (Sincronizar posts.bat).
  # The state file is excluded so the workflow's own commits never retrigger it.
  push:
    branches: [main]
    paths:
      - "vault/**"
      - "!vault/state.bin"
  # "Run workflow" button in the Actions tab (also used by Rellenar Buffer.bat).
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo mostrar qué se programaría"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: buffer-fill
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fill Buffer queue
        env:
          BUFFER_KEY: ${{ secrets.BUFFER_KEY }}
          POSTS_PASSWORD: ${{ secrets.POSTS_PASSWORD }}
          BUFFER_CHANNEL: ${{ vars.BUFFER_CHANNEL }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/buffer_fill.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898313+github-actions[bot]@users.noreply.github.com"
          git add vault/state.bin
          git diff --cached --quiet && exit 0
          git commit -m "chore: update state [skip ci]"
          git pull --rebase
          git push
